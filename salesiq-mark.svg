<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="50 50 400 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SalesIQ mark</title>
  <desc>Three rising bars in purple with a magnifier lens overlapping the tallest bar</desc>

  <!-- Background square -->
  <rect x="50" y="50" width="400" height="400" rx="60" fill="#1a1035"/>

  <!-- Subtle grid lines -->
  <line x1="75" y1="350" x2="425" y2="350" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="75" y1="300" x2="425" y2="300" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="75" y1="250" x2="425" y2="250" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="75" y1="200" x2="425" y2="200" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Bar 1 — short -->
  <rect x="95" y="300" width="72" height="100" rx="10" fill="#bda6fe"/>
  <!-- Bar 2 — medium -->
  <rect x="214" y="230" width="72" height="170" rx="10" fill="#9d7cfd"/>
  <!-- Bar 3 — tall -->
  <rect x="333" y="155" width="72" height="245" rx="10" fill="#7c5cfc"/>

  <!-- Magnifier lens -->
  <circle cx="369" cy="208" r="52" fill="none" stroke="#ffffff" stroke-width="8"/>
  <!-- Handle -->
  <line x1="409" y1="248" x2="440" y2="282" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Highlight inside lens -->
  <circle cx="355" cy="193" r="14" fill="rgba(255,255,255,0.18)"/>
</svg>
